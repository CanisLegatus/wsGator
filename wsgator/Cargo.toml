[package]
name = "wsgator"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = { workspace = true }
description = "A focused WebSocket load-testing CLI"
repository = "https://github.com/CanisLegatus/wsGator"
readme = "../README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hdrhistogram = "7.5"
humantime = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util", "process"] }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
